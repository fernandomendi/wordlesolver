services:
  api:
    build:
      context: .
      dockerfile: api/Containerfile
    ports:
      - "5000:5000"
    volumes:
      - ./core:/app/core
      - ./api:/app/api
    environment:
      - FLASK_ENV=development

  frontend:
    build:
      context: ./frontend
      dockerfile: Containerfile
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_PROXY_TARGET=http://api:5000
    depends_on:
      - api
