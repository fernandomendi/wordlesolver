[build-system]
requires = [
    "setuptools>=77.0",
    "wheel",
]
build-backend = "setuptools.build_meta"

[project]
name = "wordlesolver"
dynamic = [
    "version",
]
description = "Wordle assistant library based on Mathematics and Information Theory"
readme = "README.md"
authors = [
  { name="Fernando Mendi", email="fernandoomendi@gmail.com" },
]
license = "BSD-3-Clause"
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]

[project.urls]
repository = "https://github.com/fernandomendi/wordlesolver"

[tool.setuptools.packages.find]
where = ["."]
include = ["core*"]

[tool.setuptools.package-data]
"core.data" = ["**/*.csv"]

[tool.pytest.ini_options]
testpaths = [
    "tests/",
]
