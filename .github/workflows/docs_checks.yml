name: Docs Checks

on:
  pull_request:
    branches:
      - main

jobs:
  docs:
    name: Markdown lint and link check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Markdown lint
        uses: DavidAnson/markdownlint-cli2-action@v20
        with:
          globs: |
            **/*.md

      - name: Link check
        uses: lycheeverse/lychee-action@v2
        with:
          args: |
            --verbose
            --include-mail=false
            "./**/*.md"
